<!doctype html><html><head><meta charset="utf-8"><style>/*CSS*/
.wrap { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr); gap: 12px; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
#disk { height: 430px; } #tn { height: 230px; } .s { height: 140px; }
</style></head><body>
<div class="bar">
  <div class="ctl"><label>자석 회전 속도 <b id="lM"></b></label><input id="M" type="range" min="-3000" max="3000" step="10" value="60"></div>
  <div class="ctl" style="max-width:200px"><label>원판 재질</label><select id="mat"></select></div>
  <div class="ctl"><label>자석–원판 간격 (공극) <b id="lG"></b></label><input id="G" type="range" min="1" max="20" step="0.5" value="4"></div>
  <div class="ctl"><label>원판 제동 토크 (부하) <b id="lB"></b></label><input id="TB" type="range" min="0" max="100" step="1" value="0"></div>
  <label class="chk"><input id="on" type="checkbox" checked>자석 있음</label>
  <div class="ctl" style="max-width:120px"><label>재생 속도</label><select id="spd">
    <option value="1" selected>실제 속도</option><option value="0.5">1/2 배</option><option value="0.2">1/5 배</option><option value="0.05">1/20 배</option></select></div>
  <button id="spin">🖐 원판 손으로 돌리기 (300 rpm)</button>
  <button id="pause">⏸ 일시정지</button><button id="restart" class="primary">⟲ 처음부터 (원판 정지)</button>
</div>
<div class="readout" id="ro"></div>
<div class="wrap">
  <div><canvas id="disk"></canvas>
    <div class="note">위에서 본 그림. 원판 <b>아래</b>에서 자석(빨강 N, 파랑 S)이 돕니다. 회색 표시선은 원판에 붙어 함께 돕니다.
      소용돌이 화살표는 자석 앞·뒤에 생기는 <b>와전류</b>, 초록 화살표는 원판이 받는 힘입니다.</div></div>
  <div><canvas id="tn"></canvas><canvas class="s" id="cW"></canvas><canvas class="s" id="cT"></canvas></div>
</div>
<script>/*ARAGO*/</script><script>/*CHARTS*/</script>
<script>
const $ = (id) => document.getElementById(id), RPM = 60 / (2 * Math.PI), DEG = Math.PI / 180;
const sim = new AragoEngine.Arago({});
Object.keys(AragoEngine.MATERIALS).forEach((k) => { const o = document.createElement("option"); o.textContent = k; $("mat").appendChild(o); });
let Tmax0 = 0.3;
function apply() {
  const rpm = +$("M").value, gap = +$("G").value / 1000;
  sim.set({ wm: rpm / RPM, mat: $("mat").value, gap, magnetOn: $("on").checked });
  // 제동 토크 슬라이더는 '자석 정지 상태 원판에 걸리는 최대 와전류 토크' 대비 비율
  const dwRef = Math.max(Math.abs(rpm / RPM), 1);
  Tmax0 = Math.max(sim.torque(dwRef), 1e-6);
  sim.set({ Tb: Tmax0 * +$("TB").value / 100 });
  $("lM").textContent = `${rpm} rpm`; $("lG").textContent = `${$("G").value} mm (B ≈ ${sim.B().toFixed(2)} T)`;
  $("lB").textContent = `${(sim.c.Tb * 1000).toFixed(1)} mN·m`;
}
["M", "mat", "G", "TB", "on"].forEach((id) => $(id).addEventListener("input", apply)); apply();
let paused = false;
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "▶ 계속" : "⏸ 일시정지"; };
$("restart").onclick = () => { sim.reset(); [sW, sT].forEach((s) => s.clear()); nextSample = 0; };
$("spin").onclick = () => { sim.wd = 300 / RPM; };
const sW = new RTCharts.Strip($("cW"), [{ name: "자석", color: "#d62828", dash: true }, { name: "원판", color: "#264653" }], { title: "속도 [rpm]", minSpan: 20 });
const sT = new RTCharts.Strip($("cT"), [{ name: "와전류 토크", color: "#2a9d8f" }, { name: "제동 토크", color: "#6c757d", dash: true }], { title: "토크 [mN·m]", minSpan: 1 });

// ---- 원판 그림 ----
function curl(ctx, x, y, r, ccw, alpha) {   // 소용돌이(와전류) 화살표
  if (alpha < 0.05) return;
  ctx.save(); ctx.strokeStyle = `rgba(234,88,12,${alpha})`; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 2.2;
  const a0 = 0.3, a1 = 2 * Math.PI - 0.5;
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1, false); ctx.stroke();
  // 화살촉 (그림 좌표: arc 는 시계 방향이 양수 → ccw 이면 반대로 그림)
  const ae = ccw ? a0 : a1, dir = ccw ? -1 : 1;
  const ex = x + r * Math.cos(ae), ey = y + r * Math.sin(ae);
  const tx = -Math.sin(ae) * dir, ty = Math.cos(ae) * dir;
  ctx.beginPath(); ctx.moveTo(ex + tx * 7, ey + ty * 7); ctx.lineTo(ex - ty * 5, ey + tx * 5); ctx.lineTo(ex + ty * 5, ey - tx * 5); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function arrow(ctx, x1, y1, x2, y2, col, w) {
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 4) return;
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L, hd = Math.min(12, 4 + L * 0.3);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hd, y2 - uy * hd); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - ux * hd - uy * hd * 0.5, y2 - uy * hd + ux * hd * 0.5); ctx.lineTo(x2 - ux * hd + uy * hd * 0.5, y2 - uy * hd - ux * hd * 0.5); ctx.closePath(); ctx.fill();
}
function drawDisk(o) {
  const [ctx, W, H] = RTCharts.setupCanvas($("disk")); ctx.clearRect(0, 0, W, H);
  const S = Math.min(W, H) / 2.5, cx = W / 2, cy = H / 2;
  const P = (r, a) => [cx + r * S * Math.cos(a), cy - r * S * Math.sin(a)];   // r: 원판 반지름 = 1
  const mat = sim.mat();
  // 원판
  ctx.beginPath(); ctx.arc(cx, cy, S, 0, 2 * Math.PI); ctx.fillStyle = mat.color; ctx.fill(); ctx.strokeStyle = "#555"; ctx.lineWidth = 2; ctx.stroke();
  if (mat.slotted) for (let k = 0; k < 16; k++) {
    const a = o.thd + k * 2 * Math.PI / 16; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(...P(0.3, a)); ctx.lineTo(...P(0.97, a)); ctx.stroke();
  }
  for (let k = 0; k < 8; k++) {   // 원판에 붙은 표시선
    const a = o.thd + k * 2 * Math.PI / 8; ctx.strokeStyle = k === 0 ? "#111" : "rgba(60,60,60,0.45)"; ctx.lineWidth = k === 0 ? 3 : 1.5;
    ctx.beginPath(); ctx.moveTo(...P(0.12, a)); ctx.lineTo(...P(0.92, a)); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 0.08 * S, 0, 2 * Math.PI); ctx.fillStyle = "#444"; ctx.fill();
  // 자석 (원판 아래) — N, S
  const rm = sim.c.rm / sim.c.R, half = (sim.c.a / sim.c.R) / 2;
  const on = sim.c.magnetOn, dir = Math.sign(o.dw) || 0;
  const Jmag = Math.min(1, Math.abs(o.dw * sim.c.rm) * sim.mat().sigma * o.B / 4e6);   // 와전류 세기 (표시용)
  [[0, "#d62828", "N"], [Math.PI, "#1d4ed8", "S"]].forEach(([off, col, lab]) => {
    const a = o.thm + off, [mx, my] = P(rm, a);
    if (on) {
      ctx.save(); ctx.translate(mx, my); ctx.rotate(-a);
      ctx.globalAlpha = 0.85; ctx.fillStyle = col; ctx.fillRect(-half * S * 1.3, -half * S * 1.3, 2.6 * half * S, 2.6 * half * S);
      ctx.setLineDash([4, 3]); ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.strokeRect(-half * S * 1.3, -half * S * 1.3, 2.6 * half * S, 2.6 * half * S);
      ctx.restore(); ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(lab, mx, my);
    }
    // 와전류 소용돌이: 자석이 원판에 대해 움직이는 방향(접선, dir) 의 앞과 뒤
    if (on && dir !== 0 && sim.mat().sigma > 0) {
      const da = 0.32 * dir;   // 자석 앞쪽 각도 오프셋
      const sgnPole = lab === "N" ? 1 : -1;
      // N 극 앞: 위로 향하는 자속이 늘어남 → 아래로 향하는 자계를 만들도록 (위에서 보면) 시계 방향 전류
      const [fx, fy] = P(rm, a + da), [bx, by] = P(rm, a - da);
      curl(ctx, fx, fy, 0.11 * S, sgnPole < 0, Jmag);
      curl(ctx, bx, by, 0.11 * S, sgnPole > 0, Jmag);
      // 원판이 받는 힘: 자석이 움직이는 방향으로 끌려감 (접선)
      const fl = Math.min(1, Math.abs(o.T) / Math.max(Tmax0, 1e-9)) * 0.45 * S;
      const tx = -Math.sin(a) * dir, ty = -Math.cos(a) * dir;
      arrow(ctx, mx, my, mx + tx * fl, my + ty * fl, "#16a34a", 4);
    }
  });
  ctx.fillStyle = "#333"; ctx.font = "13px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText(`자석 ${(o.wm * RPM).toFixed(0)} rpm · 원판 ${(o.wd * RPM).toFixed(1)} rpm`, 6, 4);
}
// ---- 토크–원판 속도 곡선 ----
function drawTN(o) {
  const [ctx, W, H] = RTCharts.setupCanvas($("tn")); ctx.clearRect(0, 0, W, H);
  const L = 50, R = 10, T = 24, B = 30, pw = W - L - R, ph = H - T - B;
  const wm = o.wm, span = Math.max(Math.abs(wm) * 1.3, 30 / RPM);
  const x0 = -span * 0.3, x1 = span;   // 원판 속도 축 (자석과 같은 방향 기준)
  const sg = Math.sign(wm) || 1, N = 160, xs = [], ys = [];
  for (let i = 0; i <= N; i++) { const wd = sg * (x0 + (x1 - x0) * i / N); xs.push(wd); ys.push(sim.torque(wm - wd) * 1000); }
  const ymax = Math.max(...ys.map(Math.abs), sim.c.Tb * 1000, 1) * 1.15;
  const X = (wd) => L + ((wd * sg - x0) / (x1 - x0)) * pw, Y = (y) => T + (1 - (y + ymax * 0.15) / (ymax * 1.15)) * ph;
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 1; ctx.strokeRect(L, T, pw, ph);
  ctx.strokeStyle = "#bbb"; ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + pw, Y(0)); ctx.stroke();
  ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(wm), T); ctx.lineTo(X(wm), T + ph); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = "#2a9d8f"; ctx.lineWidth = 2.5; ctx.beginPath();
  xs.forEach((w, i) => (i ? ctx.lineTo(X(w), Y(ys[i])) : ctx.moveTo(X(w), Y(ys[i])))); ctx.stroke();
  ctx.strokeStyle = "#6c757d"; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(L, Y(sim.c.Tb * 1000)); ctx.lineTo(L + pw, Y(sim.c.Tb * 1000)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#e76f51"; ctx.beginPath(); ctx.arc(X(o.wd), Y(o.T * 1000), 6, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = "#333"; ctx.font = "bold 12px system-ui"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText("와전류 토크 – 원판 속도 (● 현재)", L, 4);
  ctx.font = "11px system-ui"; ctx.fillStyle = "#666"; ctx.textAlign = "center";
  ctx.fillText("원판 속도 [rpm]", L + pw / 2, H - 14);
  [x0, 0, x1 / 2, x1].forEach((v) => ctx.fillText((v * RPM).toFixed(0), X(sg * v), T + ph + 3));
  ctx.fillText("자석 속도 (슬립 0)", X(wm), T + 2);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  [0, ymax / 2, ymax].forEach((v) => ctx.fillText(v.toFixed(1), L - 4, Y(v)));
  ctx.save(); ctx.translate(12, T + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = "center"; ctx.fillText("토크 [mN·m]", 0, 0); ctx.restore();
}
let last = performance.now(), nextSample = 0;
function frame(now) {
  const dtWall = Math.min((now - last) / 1000, 0.05); last = now;
  const win = 6 * +$("spd").value + 2;
  if (!paused) {
    const dt = dtWall * +$("spd").value, n = Math.max(1, Math.ceil(dt / 1e-3));
    for (let k = 0; k < n; k++) {
      sim.step(dt / n);
      if (sim.t >= nextSample) { const o = sim.out(); sW.push(o.t, [o.wm * RPM, o.wd * RPM]); sT.push(o.t, [o.T * 1000, o.Tb * 1000]); nextSample = o.t + win / 500; }
    }
  }
  const o = sim.out(); drawDisk(o); drawTN(o); [sW, sT].forEach((s) => s.draw(o.t, win));
  $("ro").innerHTML = `<span>시각 <b>${o.t.toFixed(2)} s</b></span><span>자석 <b>${(o.wm * RPM).toFixed(0)} rpm</b></span><span>원판 <b>${(o.wd * RPM).toFixed(1)} rpm</b></span>` +
    `<span>슬립 <b>${isNaN(o.slip) ? "—" : (o.slip * 100).toFixed(1) + " %"}</b></span><span>와전류 토크 <b>${(o.T * 1000).toFixed(2)} mN·m</b></span>` +
    `<span>B <b>${o.B.toFixed(2)} T</b></span><span>원판 관성 <b>${(o.J * 1e3).toFixed(2)} g·m²</b></span>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
