<!doctype html><html><head><meta charset="utf-8"><style>/*CSS*/
body { padding: 2px 4px 8px; }
.sec { margin: 4px 0 16px; }
.sec h5 { margin: 10px 0 6px; font-size: 15px; font-weight: 600; color: #222; }
.row, .cols { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-start; margin: 4px 0 6px; }
.cols { flex-wrap: nowrap; gap: 14px; }
.col { min-width: 0; }
@media (max-width: 760px) { .cols { flex-wrap: wrap; } .col { flex: 1 1 100% !important; } }
.ctl { display: flex; flex-direction: column; min-width: 160px; flex: 1 1 160px; font-size: 13px; margin-bottom: 2px; }
.ctl.wide { flex: 2 1 280px; }
.ctl > label { color: #555; margin-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; }
.ctl > label b { color: #d9534f; font-weight: 600; white-space: nowrap; }
.ctl input[type=range] { width: 100%; accent-color: #d9534f; margin: 2px 0; }
.ctl select, .ctl input[type=number] { padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; }
.radio { display: flex; flex-direction: column; gap: 3px; } .radio.horiz { flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
.radio label, .chk { display: flex; gap: 6px; align-items: center; color: #333; font-size: 13px; cursor: pointer; }
.radio input, .chk input { accent-color: #d9534f; }
.note { font-size: 12.5px; color: #666; line-height: 1.5; margin: 4px 0 8px; }
.plot { width: 100%; }
.svgbox { width: 100%; }
.metrics { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 6px 0 10px; }
.metric { flex: 1 1 150px; min-width: 130px; }
.metric .ml { font-size: 12.5px; color: #555; }
.metric .mv { font-size: 24px; font-weight: 400; color: #222; line-height: 1.25; font-variant-numeric: tabular-nums; }
.metric .ms { display: inline-block; font-size: 11.5px; color: #555; background: #f0f2f6; border-radius: 10px; padding: 1px 8px; margin-top: 2px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; }
.tbl th, .tbl td { border-bottom: 1px solid #eee; padding: 4px 8px; text-align: left; font-variant-numeric: tabular-nums; }
.tbl th { color: #666; font-weight: 600; background: #fafafa; }
.info { background: #e8f1fb; color: #1c4e80; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
