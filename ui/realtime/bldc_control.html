<!doctype html><html><head><meta charset="utf-8"><style>/*CSS*/
.wrap { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 8px; }
.side .ctl { min-width: 0; flex: none; }
.row { display: flex; gap: 8px; } .side .row > .ctl { flex: 1 1 0; min-width: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; } .qb button { padding: 3px 8px; font-size: 12px; }
canvas.s { height: 160px; }
</style></head><body>
<div class="readout" id="ro"></div>
<div class="wrap">
 <div class="side">
  <div class="btns"><button id="restart" class="primary">⟲ 처음부터 다시 (정지 상태)</button><button id="pause">⏸ 일시정지</button></div>
  <div class="group"><h4>운전 (움직이는 즉시 반영)</h4>
    <div class="ctl"><label>속도 지령 ω* <b id="lW"></b></label><input id="W" type="range"></div>
    <div class="btns qb" id="quick"></div>
    <div class="ctl"><label>부하 토크 TL <b id="lT"></b></label><input id="TL" type="range"></div>
    <div class="ctl"><label>홀 센서 위치 오차 <b id="lH"></b></label><input id="HO" type="range" min="-40" max="40" step="1" value="0"></div>
    <label class="chk"><input id="fric" type="checkbox" checked>마찰형 부하 (회전 반대 방향)</label>
    <label class="chk"><input id="ol" type="checkbox">개루프로 운전 (듀티 = 2ke·ω*/Vdc)</label>
  </div>
  <div class="group"><h4>전류 제한</h4>
    <div class="ctl"><label>토크 전류 제한 I_lim <b id="lI"></b></label><input id="Ilim" type="range"></div></div>
  <div class="group"><h4>게인</h4>
    <div class="row"><div class="ctl"><label>Kpω [A·s/rad]</label><input id="Kpw" type="number" step="any"></div>
      <div class="ctl"><label>Kiω [A/rad]</label><input id="Kiw" type="number" step="any"></div></div>
    <div class="row"><div class="ctl"><label>Kpi [V/A]</label><input id="Kpi" type="number" step="any"></div>
      <div class="ctl"><label>Kii [V/(A·s)]</label><input id="Kii" type="number" step="any"></div></div>
    <div class="row"><div class="ctl"><label>전류 대역 ωci [rad/s]</label><input id="wci" type="number" value="3000"></div>
      <div class="ctl"><label>속도 대역 ωcs [rad/s]</label><input id="wcs" type="number" value="150"></div></div>
    <div class="btns" style="margin-top:6px"><button id="rec">추천 게인 적용</button></div>
    <label class="chk"><input id="aw" type="checkbox" checked>안티와인드업</label>
    <label class="chk"><input id="ff" type="checkbox" checked>역기전력 피드포워드 (2ke·ω)</label>
    <div class="note" id="gnote"></div>
  </div>
  <div class="group"><h4>보기</h4>
    <div class="row"><div class="ctl"><label>재생 속도</label><select id="spd">
      <option value="0.01">1/100 배</option><option value="0.05" selected>1/20 배</option><option value="0.1">1/10 배</option>
      <option value="0.25">1/4 배</option></select></div>
    <div class="ctl"><label>화면 폭</label><select id="win">
      <option value="0.05">50 ms</option><option value="0.2" selected>200 ms</option><option value="0.5">0.5 s</option><option value="1">1 s</option></select></div></div>
  </div>
 </div>
 <div><canvas class="s" id="cW"></canvas><canvas class="s" id="cI"></canvas><canvas class="s" id="cD"></canvas><canvas class="s" id="cT"></canvas></div>
</div>
<script>/*BLDC*/</script>
<script>/*CHARTS*/</script>
<script>
const CFG = /*CONFIG*/;
const $ = (id) => document.getElementById(id);
const RPM = 60 / (2 * Math.PI), DEG = Math.PI / 180, P = CFG.p, K = 2 * P.ke;
const wMaxRpm = Math.ceil(P.Vdc / K * RPM / 100) * 100;
$("W").min = -wMaxRpm; $("W").max = wMaxRpm; $("W").step = 10; $("W").value = Math.round(0.6 * wMaxRpm / 100) * 100;
const tlMax = +(2 * CFG.Trated).toPrecision(2); $("TL").min = 0; $("TL").max = tlMax; $("TL").step = tlMax / 100; $("TL").value = 0;
$("Ilim").min = Math.max(0.5, +(0.25 * CFG.Irated).toPrecision(2)); $("Ilim").max = 5 * CFG.Irated; $("Ilim").step = 0.5; $("Ilim").value = 2 * CFG.Irated;
[0.9, 0.5, 0, -0.6].forEach((f) => { const v = Math.round(f * wMaxRpm / 100) * 100, b = document.createElement("button");
  b.textContent = (v > 0 ? "+" : "") + v + " rpm"; b.onclick = () => { $("W").value = v; apply(); }; $("quick").appendChild(b); });
function setGains(g) { ["Kpw", "Kiw", "Kpi", "Kii"].forEach((k) => { $(k).value = +g[k].toPrecision(4); }); }
setGains(BLDCEngine.recommendedGains(P, 3000, 150));
const cfgNow = () => ({ Ts: 1e-4, h: 1e-5, wRef: +$("W").value / RPM, TL: +$("TL").value, friction: $("fric").checked,
  hallOffset: +$("HO").value * DEG, Ilim: +$("Ilim").value, Kpw: +$("Kpw").value, Kiw: +$("Kiw").value,
  Kpi: +$("Kpi").value, Kii: +$("Kii").value, aw: $("aw").checked, ff: $("ff").checked, openLoop: $("ol").checked });
const ctl = new BLDCEngine.BLDCCascade(P, cfgNow());
function apply() {
  const c = cfgNow(); ctl.set(c);
  $("lW").textContent = (+$("W").value).toFixed(0) + " rpm"; $("lT").textContent = c.TL.toPrecision(3) + " N·m";
  $("lI").textContent = c.Ilim.toFixed(1) + " A"; $("lH").textContent = $("HO").value + "° (전기각)";
  sI.hlines = [{ y: c.Ilim, color: "#d62828" }, { y: -c.Ilim, color: "#d62828" }];
  $("gnote").textContent = `등가 토크 상수 K = 2ke = ${K.toFixed(3)} N·m/A, 선간 시정수 L/R = ${(P.L / P.R * 1000).toFixed(2)} ms. 전류 PI: Kp = ωci·2L, Ki = ωci·2R. 속도 PI: Kp = ωcs·J/K, Ki = Kp·ωcs/4.`;
}
document.querySelectorAll("input,select").forEach((el) => el.addEventListener("input", apply));
$("rec").onclick = () => { setGains(BLDCEngine.recommendedGains(P, +$("wci").value, +$("wcs").value)); apply(); };
let paused = false;
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "▶ 계속" : "⏸ 일시정지"; };
$("restart").onclick = () => { ctl.reset(); [sW, sI, sD, sT].forEach((s) => s.clear()); nextSample = 0; };
const sW = new RTCharts.Strip($("cW"), [{ name: "지령 ω*", color: "#e9c46a", width: 3 }, { name: "실제 ω", color: "#264653" }], { title: "속도 [rpm]", minSpan: 100 });
const sI = new RTCharts.Strip($("cI"), [{ name: "지령 I*", color: "#e9c46a", width: 3 }, { name: "토크 전류 Te/2ke", color: "#e76f51" },
  { name: "A상 전류 ia", color: "#9aa0a6", width: 1 }], { title: "전류 [A] (빨간 점선: 제한)", minSpan: 2 });
const sD = new RTCharts.Strip($("cD"), [{ name: "듀티 d × Vdc", color: "#1d3557" }, { name: "선간 역기전력 2ke·ω", color: "#2a9d8f", dash: true }], { title: "전압 [V]", minSpan: 5 });
const sT = new RTCharts.Strip($("cT"), [{ name: "Te", color: "#2a9d8f" }, { name: "TL", color: "#6c757d", dash: true }], { title: "토크 [N·m]", minSpan: 0.05 });
apply();
let last = performance.now(), nextSample = 0;
function frame(now) {
  const dtWall = Math.min((now - last) / 1000, 0.05); last = now;
  const win = +$("win").value;
  if (!paused) {
    const dtSim = dtWall * +$("spd").value, nsub = Math.max(1, Math.round(dtSim / 1e-4));
    for (let k = 0; k < nsub; k++) {
      ctl.advance(dtSim / nsub);
      if (ctl.t >= nextSample) {
        const o = ctl.out();
        sW.push(o.t, [o.wRef * RPM, o.w * RPM]); sI.push(o.t, [o.iRef, o.iT, o.ia]);
        sD.push(o.t, [o.duty * P.Vdc, K * o.w]); sT.push(o.t, [o.Te, o.TL]);
        nextSample = o.t + win / 600;
      }
    }
  }
  const o = ctl.out();
  [sW, sI, sD, sT].forEach((s) => s.draw(o.t, win));
  $("ro").innerHTML = `<span>시각 <b>${o.t.toFixed(3)} s</b></span><span>ω* <b>${(o.wRef * RPM).toFixed(0)} rpm</b></span>` +
    `<span>ω <b>${(o.w * RPM).toFixed(0)} rpm</b></span><span>토크 전류 <b>${o.iT.toFixed(2)} A</b></span>` +
    `<span>듀티 <b>${(o.duty * 100).toFixed(1)} %</b></span><span>Te <b>${o.Te.toFixed(3)} N·m</b></span>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
