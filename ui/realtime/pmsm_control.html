<!doctype html><html><head><meta charset="utf-8"><style>/*CSS*/
.wrap { display: grid; grid-template-columns: 300px 1fr; gap: 12px; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 8px; } .side .ctl { min-width: 0; flex: none; }
.row { display: flex; gap: 8px; } .side .row > .ctl { flex: 1 1 0; min-width: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; } .qb button { padding: 3px 8px; font-size: 12px; }
canvas.s { height: 160px; }
</style></head><body>
<div class="readout" id="ro"></div>
<div class="wrap"><div class="side">
  <div class="btns"><button id="restart" class="primary">⟲ 처음부터 다시 (정지 상태)</button><button id="pause">⏸ 일시정지</button></div>
  <div class="group"><h4>전류 지령 방식</h4><div class="ctl"><select id="mode">
    <option value="id0">id = 0 제어</option><option value="mtpa">MTPA</option><option value="fw" selected>MTPA + 약계자</option></select></div></div>
  <div class="group"><h4>운전 (움직이는 즉시 반영)</h4>
    <div class="ctl"><label>속도 지령 n* <b id="lW"></b></label><input id="W" type="range"></div>
    <div class="btns qb" id="quick"></div>
    <div class="ctl"><label>부하 토크 TL <b id="lT"></b></label><input id="TL" type="range"></div>
    <div class="ctl"><label>최대 전류 I_max <b id="lI"></b></label><input id="Imax" type="range"></div>
    <label class="chk"><input id="fric" type="checkbox" checked>마찰형 부하</label></div>
  <div class="group"><h4>게인</h4>
    <div class="row"><div class="ctl"><label>Kpω</label><input id="Kpw" type="number" step="any"></div><div class="ctl"><label>Kiω</label><input id="Kiw" type="number" step="any"></div></div>
    <div class="row"><div class="ctl"><label>Kpd</label><input id="Kpd" type="number" step="any"></div><div class="ctl"><label>Kid</label><input id="Kid" type="number" step="any"></div></div>
    <div class="row"><div class="ctl"><label>Kpq</label><input id="Kpq" type="number" step="any"></div><div class="ctl"><label>Kiq</label><input id="Kiq" type="number" step="any"></div></div>
    <div class="row"><div class="ctl"><label>ωci [rad/s]</label><input id="wci" type="number" value="2000"></div><div class="ctl"><label>ωcs [rad/s]</label><input id="wcs" type="number" value="100"></div></div>
    <div class="btns" style="margin-top:6px"><button id="rec">추천 게인 적용</button></div>
    <label class="chk"><input id="ff" type="checkbox" checked>비간섭 보상 (−ωLq·iq, ω(Ld·id + λf))</label>
    <label class="chk"><input id="aw" type="checkbox" checked>안티와인드업</label>
    <div class="ctl"><label>약계자 적분 게인 Kfw [A/(V·s)]</label><input id="Kfw" type="number" value="200"></div>
    <div class="note" id="gnote"></div></div>
  <div class="group"><h4>보기</h4><div class="row">
    <div class="ctl"><label>재생 속도</label><select id="spd"><option value="0.02">1/50 배</option><option value="0.05" selected>1/20 배</option><option value="0.1">1/10 배</option><option value="0.25">1/4 배</option></select></div>
    <div class="ctl"><label>화면 폭</label><select id="win"><option value="0.1">0.1 s</option><option value="0.3" selected>0.3 s</option><option value="1">1 s</option></select></div></div></div>
</div><div><canvas class="s" id="cW"></canvas><canvas class="s" id="cI"></canvas><canvas class="s" id="cV"></canvas><canvas class="s" id="cT"></canvas></div></div>
<script>/*AC*/</script><script>/*CHARTS*/</script>
<script>
const CFG = /*CONFIG*/;
const $ = (id) => document.getElementById(id), RPM = 60 / (2 * Math.PI), P = CFG.p;
const nmax = Math.round(2.5 * CFG.nBase / 100) * 100;
$("W").min = -nmax; $("W").max = nmax; $("W").step = 10; $("W").value = Math.round(1.5 * CFG.nBase / 100) * 100;
const tlMax = +(1.1 * CFG.Tmax).toPrecision(2); $("TL").min = 0; $("TL").max = tlMax; $("TL").step = tlMax / 100; $("TL").value = 0;
$("Imax").min = 1; $("Imax").max = Math.round(2 * CFG.Imax); $("Imax").step = 0.5; $("Imax").value = CFG.Imax;
[2.0, 1.0, 0.5, -1.0].forEach((f) => { const v = Math.round(f * CFG.nBase / 100) * 100, b = document.createElement("button");
  b.textContent = (v > 0 ? "+" : "") + v + " rpm"; b.onclick = () => { $("W").value = v; apply(); }; $("quick").appendChild(b); });
function setGains(gg) { ["Kpw", "Kiw", "Kpd", "Kid", "Kpq", "Kiq"].forEach((k) => { $(k).value = +gg[k].toPrecision(4); }); }
setGains(ACEngine.pmsmGains(P, 2000, 100));
const cfgNow = () => ({ mode: $("mode").value, Ts: 1e-4, h: 2e-5, wRef: +$("W").value / RPM, TL: +$("TL").value, friction: $("fric").checked,
  Imax: +$("Imax").value, Kpw: +$("Kpw").value, Kiw: +$("Kiw").value, Kpd: +$("Kpd").value, Kid: +$("Kid").value, Kpq: +$("Kpq").value, Kiq: +$("Kiq").value,
  ff: $("ff").checked, aw: $("aw").checked, Kfw: +$("Kfw").value });
const drv = new ACEngine.PMSMDrive(P, cfgNow());
function apply() { const c = cfgNow(); drv.set(c);
  $("lW").textContent = `${(+$("W").value).toFixed(0)} rpm (기저 ${CFG.nBase.toFixed(0)})`; $("lT").textContent = c.TL.toPrecision(3) + " N·m"; $("lI").textContent = c.Imax.toFixed(1) + " A";
  sI.hlines = [{ y: c.Imax, color: "#d62828" }, { y: -c.Imax, color: "#d62828" }];
  $("gnote").textContent = `전류 PI: Kpd = ωci·Ld, Kpq = ωci·Lq, Ki = ωci·Rs. 속도 PI: Kp = ωcs·J/KT, KT = (3/2)(P/2)λf = ${(1.5 * Math.round(P.poles / 2) * P.lam).toFixed(3)} N·m/A.`; }
document.querySelectorAll("input,select").forEach((el) => el.addEventListener("input", apply));
$("rec").onclick = () => { setGains(ACEngine.pmsmGains(P, +$("wci").value, +$("wcs").value)); apply(); };
let paused = false;
$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "▶ 계속" : "⏸ 일시정지"; };
$("restart").onclick = () => { drv.reset(); [sW, sI, sV, sT].forEach((s) => s.clear()); nextSample = 0; };
const sW = new RTCharts.Strip($("cW"), [{ name: "지령 n*", color: "#e9c46a", width: 3 }, { name: "실제 n", color: "#264653" }], { title: "속도 [rpm]", minSpan: 50 });
const sI = new RTCharts.Strip($("cI"), [{ name: "id*", color: "#f4a3a3", width: 3 }, { name: "id", color: "#d62828" }, { name: "iq*", color: "#9fd8a8", width: 3 }, { name: "iq", color: "#2a9d3a" }], { title: "dq 전류 [A]", minSpan: 2 });
const sV = new RTCharts.Strip($("cV"), [{ name: "|v|", color: "#1d3557" }, { name: "전압 한계 Vdc/√3", color: "#d62828", dash: true }], { title: "전압 크기 [V]", minSpan: 10 });
const sT = new RTCharts.Strip($("cT"), [{ name: "Te", color: "#2a9d8f" }, { name: "TL", color: "#6c757d", dash: true }], { title: "토크 [N·m]", minSpan: 0.5 });
apply();
let last = performance.now(), nextSample = 0;
function frame(now) {
  const dtWall = Math.min((now - last) / 1000, 0.05); last = now;
  const win = +$("win").value;
  if (!paused) {
    const dtSim = dtWall * +$("spd").value, n = Math.max(1, Math.round(dtSim / 1e-3));
    for (let k = 0; k < n; k++) {
      drv.advance(dtSim / n);
      if (drv.t >= nextSample) { const o = drv.out();
        sW.push(o.t, [o.wRef * RPM, o.w * RPM]); sI.push(o.t, [o.idRef, o.id, o.iqRef, o.iq]); sV.push(o.t, [o.vmag, o.Vmax]); sT.push(o.t, [o.Te, o.TL]); nextSample = o.t + win / 600; }
    }
  }
  const o = drv.out(); [sW, sI, sV, sT].forEach((s) => s.draw(o.t, win));
  $("ro").innerHTML = `<span>시각 <b>${o.t.toFixed(3)} s</b></span><span>n* <b>${(o.wRef * RPM).toFixed(0)}</b></span><span>n <b>${(o.w * RPM).toFixed(0)} rpm</b></span>` +
    `<span>id <b>${o.id.toFixed(2)}</b> iq <b>${o.iq.toFixed(2)} A</b></span><span>|v| <b>${o.vmag.toFixed(0)} V</b></span><span>Te <b>${o.Te.toFixed(2)} N·m</b></span>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
